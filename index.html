<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NBA Teams & Rosters</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>🏀 NBA Teams Directory</h1>
        <p>2026-2027 Projected Starting Lineups & Past Season Records</p>
    </header>
    
    <main>
        <section class="search">
            <input type="text" id="searchInput" placeholder="Search team, division, or player...">
            <button onclick="searchTeams()">Search</button>
            <button class="secondary" onclick="loadTeams()">Show All</button>
        </section>

        <h2>ALL TEAMS</h2>
        <div id="divisionGrid" class="division-grid">
            <!-- Rendered by app.js -->
            <p>Loading NBA teams...</p>
        </div>
    </main>

    <!-- Modal for Detailed Stats & Profile -->
    <div id="teamModal" class="modal">
        <div class="modal-content">
            <span class="close-btn" onclick="closeModal()">&times;</span>
            <div id="modalBody"></div>
        </div>
    </div>

    <footer>
        <p>Data provided by the FastAPI NBA Directory</p>
    </footer>
    <script src="app.js"></script>
</body>
</html>
