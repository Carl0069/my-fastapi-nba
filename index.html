<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NBA Teams & 2026-2027 Rosters</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <div class="header-container">
            <h1>ALL TEAMS</h1>
            <div class="search-bar">
                <input 
                    type="text" 
                    id="searchInput" 
                    placeholder="Search player, team, division, or position..."
                >
                <button onclick="searchTeams()">Search</button>
                <button class="secondary" onclick="loadTeams()">Reset</button>
            </div>
        </div>
    </header>

    <main>
        <div id="divisionsContainer" class="divisions-grid">
            <p>Loading NBA teams...</p>
        </div>
    </main>

    <!-- TEAM & ROSTER MODAL -->
    <div id="teamModal" class="modal">
        <div class="modal-box">
            <span class="close-btn" onclick="closeModal()">&times;</span>
            <div id="modalContent"></div>
        </div>
    </div>

    <footer>
        <p>Data provided by NBA 2026–2027 Season REST API</p>
    </footer>

    <script src="app.js"></script>
</body>
</html>
